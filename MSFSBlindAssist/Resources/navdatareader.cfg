# =============================================================================
#
# Navdatareader configuration used by MSFS Blind Assist, passed with -c.
#
# This is the stock navdatareader.cfg (atools/navdatareader, GPL3) with ONE
# change, marked "MSFSBA" below: GSX World of Jetways files are excluded.
#
# WHY: each fsdreamteam-gsx-world-of-jetways "<ICAO>_jetways.bgl" carries a FULL
# MSFS airport record - a DELETE_AIRPORT plus a complete parking set copied from
# the DEFAULT airport - not just jetway placements. atools replaces parking
# whenever a later-processed airport record has any, so at every airport whose
# add-on scenery happens to be processed BEFORE the World of Jetways package,
# the payware stands are wiped and replaced by default-airport stands. Measured
# on a real install (2026-08-16): 18 airports affected, e.g. SKBO showed
# "G 6" for the stand vPilot Designs and the sim both call Gate 20, and EGCC,
# EKCH, KBOS, KLAS, CYYZ, EDDM, ENGM, ESSA, YMML and others were equally wrong.
# Nothing is lost by excluding them: the parking these files contain is the
# stock parking navdatareader already reads from fs-base-genericairports, and
# the sim still loads World of Jetways normally for its actual purpose.
#
# NOTE: this file REPLACES the built-in configuration - it does not merge with
# it - so every stock option has to stay present here. When updating
# navdatareader, re-copy its resources/config/navdatareader.cfg and re-apply
# the MSFSBA line.
#
# =============================================================================

[Options]

# Show statistics
DatabaseReport=true

# Fail if most important tables are not populated
BasicValidation=true

# Check airport boundaries and print warnings to log
AirportValidation=true

# Process airport deletesDatabase - only FSX/P3D/MSFS
ProcessDelete=true

# filter out dummy runways
FilterRunways=true

# Write incomplete objects
SaveIncomplete=true

# Connect airways
ResolveRoutes=true

# Debugging options - slows compilation down and creates huge log files
Verbose=false

# Debugging option - Commit after each update - very slow
Autocommit=false

# Delete duplicates
Deduplicate=true

# Drops all indexes and creates a database preparation SQL script in table "script" for the client to add them again
DropAllIndexes=false

# Drop temporary tables
DropTempTables=true

# Vaccuum database
VacuumDatabase=true

# Gather schema statistics
AnalyzeDatabase=true

# Language for MSFS airport and administrative names
MsfsAirportLanguage=

# MSFS 2024 options delay in ms
SimConnectAirportFetchDelay=100
SimConnectNavaidFetchDelay=50
SimConnectBatchSize=2000
SimConnectLoadDisconnected=true
SimConnectLoadDisconnectedFile=false

# Tables names and minimum number of rows
# An exception is thrown if the tables have less rows
# The numbers below are the minimums for DFD databases
[BasicValidationTables]
# Numbers based on cycle 1801
DFD.airport=13000
DFD.airport_file=13000
DFD.airport_msa=10000
DFD.airway=70000
DFD.approach=85000
DFD.approach_leg=400000
DFD.bgl_file=1
DFD.boundary=25000
DFD.com=40000
DFD.holding=10000
DFD.ils=4000
DFD.magdecl=1
DFD.marker=500
DFD.metadata=1
DFD.mora_grid=1
DFD.nav_search=200000
DFD.ndb=2000
DFD.parking=25000
DFD.runway=15000
DFD.runway_end=30000
DFD.scenery_area=1
DFD.script=0
DFD.transition=70000
DFD.transition_leg=200000
DFD.vor=2000
DFD.waypoint=200000

[Filter]
# Not all filters are applied to the X-Plane compilation and none to the DFD compilation.
#
# If include filter is set only the listed features are loaded
# If exclude is set all listed features as excluded
# Exclude has priority before include
# All filters are case insensitive, comma separated and use globbing expressions
# ?	Matches any single character
# *	Matches zero or more of any characters
# [...]	Sets of characters can be represented in square brackets

# If scenery is covered by this filter it will be but at the end of the loading list i.e. get highest priority
IncludeHighPriorityFilter=*/fsAerodata Files/*

# Filter files by name excluding path
# Examples: BNXWorld?.bgl or APX45*.bgl or FTX_NZSI_Unlisted_Airstrips.BGL
IncludeFilenames=

# FSX/P3D/MSFS filename prefixes:
# APX	Airports
# ATX	Routing information
# BRX	Bridges
# CVX	Various coastlines waterpolys roads
# NAX MSFS procedures and navaids with dummy airports and COM
# NVX	Navaids - VORs, NDBs, & associated scenery objects.
# OBX	Objects
# DEM	Digital elevation map
# WSX MSFS Scenery objects
# bvcf.bgl	CENTER type airspace boundaries.
# BNXWorld*	Geopolitical and airspace boundaries.
# Exclude DEM, bridges and other scenery per default
# MSFSBA: "*_jetways.bgl" added - see the header comment. Matched on filename
# only (not path) because the World of Jetways package installs outside the
# Community folder, under the FSDT Addon Manager directory, where the
# path-relative ExcludePathFilter semantics do not apply cleanly.
ExcludeFilenames=brx*.bgl,obx*.bgl,cvx*.bgl,dem*.bgl,wsx*.bgl,traffic*.bgl,AIRACCycle.bgl,*_jetways.bgl

# Filter files by path relative from scenery.cfg minus the scenery directory
# Example: Addon Scenery/JetwayExclude/*,Scenery/0501/*,Scenery/0601/*
# Full path is needed for X-Plane
# MSFS based on Microsoft.FlightSimulator_8wekyb3d8bbwe/LocalCache/Packages/Official/OneStore or Community
IncludePathFilter=
ExcludePathFilter=

# Filter airports three or four letter ICAO ident
IncludeAirportIcaoFilter=
ExcludeAirportIcaoFilter=

# =======================================================================================
# Filter by object type. Some combinations of this can result in unexpected behavour.
# that is caused by the hierarchical dependency of objects. E.g. filtering out runways
# will also remove approaches and ILS.
#
# A feature is included per default if it is not on the list "ExcludeBglObjectFilter".
IncludeBglObjectFilter=
ExcludeBglObjectFilter=APRON2,TAXIWAYRUNWAY

# Filters that define if an airport is defined as addon or not
IncludeAddonPathFilter=
ExcludeAddonPathFilter=Scenery/*,fs-base/*,fs-base-nav/*,fs-base-genericairports/*
