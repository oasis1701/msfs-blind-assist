<!-- Source-built from efb.js ChartsComponent: signed in, KLAX searched, STAR tab active.

     Router's "pt-4" page-content wrapper, visible in the charts-signedout.html capture) — the
     harness's `nav:` option prepends the nav bar as a flat sibling of this fixture's own root,
     one level shallower than the real DOM. Without this wrapper, labelInfo's outward caption
     walk (4 hops, load-bearing for perf-stepper-fallback's "Runway" span) escapes past the
     fixture root on its last hop and misreads the nav bar's own concatenated tab text as the
     "Airport ICAO" input's label. -->
