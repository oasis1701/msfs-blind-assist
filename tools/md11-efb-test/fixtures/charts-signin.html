<!-- Source-built from efb.js ChartPage: the Navigraph device-flow screen (QR code + user code). -->
<div class="flex h-full w-full flex-col items-center">
  <div class="flex h-full w-full flex-col place-content-center">
    <h1 class="mb-6 text-center text-6xl font-bold">Signing in with Navigraph</h1>
    <div class="flex w-full items-center justify-around gap-x-6">
      <div>
        <h2 class="mb-3 text-center text-4xl font-bold text-red-500">Scan a QR Code</h2>
        <div class="mx-auto w-min bg-white p-8"><svg class="qr"></svg></div>
      </div>
      <div class="flex h-full flex-col items-center justify-center">
        <div class="w-2 bg-white"></div>
        <p class="my-3 font-bold">OR</p>
        <div class="w-2 bg-white"></div>
      </div>
      <div class="flex flex-col flex-wrap place-content-center text-center">
        <h2 class="text-4xl font-bold text-red-500">Visit Navigraph</h2>
        <p class="mb-3"><span class="text-blue-300">navigraph.com/code</span></p>
        <p class="text-lg font-semibold">Type in:</p>
        <p class="text-3xl font-bold text-red-400">ABCD-EFGH</p>
      </div>
    </div>
  </div>
</div>
