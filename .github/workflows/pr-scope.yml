name: PR scope

# Advisory, not a required check (CORE-22 to CORE-25, CORE-5). A PR should be one aircraft or
# feature, say where its follow-ups are planned, build on a fresh main without dropping
# other work, name only tools and test classes that exist, and, when it touches the sim,
# say which build was sim-tested. The logic is GuideBuilder's check-scope command
# (tools/GuideBuilder/ScopeCheck.cs), covered by PrScopeCheckTests; this workflow only
# produces the lists it reads.
#
# `edited` is load-bearing: filling in the description edits it, and without it this check
# stays red until someone pushes an unrelated commit to re-run it.
#
# The plain pull_request trigger only (UPD-10): the PR's own code is read, with a
# read-only token. The description and the head commit reach the shell only through env.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-scope-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: the merge-base diff and the commit lists below need it.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fetch the base branch and main
        shell: bash
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" \
            "+refs/heads/main:refs/remotes/origin/main"

      - name: Write the lists the check reads
        shell: bash
        env:
          # Through the environment, never ${{ }} inside the script.
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Three dots = from the MERGE BASE: two dots would also count what was merged
          # into the base since this branch diverged.
          git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF...HEAD" > added.txt
          # The prefixes are pinned: a diff.noprefix or diff.mnemonicPrefix setting would
          # change the "+++ b/" headers the check reads.
          git diff -U0 --no-color --no-renames --no-ext-diff --src-prefix=a/ --dst-prefix=b/ \
            "origin/$GITHUB_BASE_REF...HEAD" > diff.txt
          git ls-tree -r --name-only HEAD > tree.txt

          # Every <Name>Tests token on a CODE line of a .cs file: a type, a method, a
          # property or field, a call. Code that names a missing name would not compile, so
          # a code token means the name exists; a comment does not, so a dangling
          # "pinned by ...Tests" comment never vouches for itself. Cutting at // also cuts a
          # line at a URL inside a string, which only drops names, never vouches for one.
          { git grep -h -I -E "[A-Z][A-Za-z0-9]*Tests\b" HEAD -- '*.cs' \
              | grep -v -E '^[[:space:]]*(//|/\*|\*)' \
              | sed -E 's#//.*$##' \
              | grep -o -E "\b[A-Z][A-Za-z0-9]*Tests\b" \
              | sort -u; } > test-classes.txt || true

          # Names the base already cites (tools/<name> and <Name>Tests, the check's own two
          # patterns in PCRE): a file moved or split in the PR shows its old lines as added,
          # and the base keeps citing one-off tools it never kept.
          { git grep -h -o -I -P "(?<![\w/.:-])tools/[A-Za-z0-9_][A-Za-z0-9_.-]*[A-Za-z0-9_]|\b[A-Z][A-Za-z0-9]*Tests\b" \
              "origin/$GITHUB_BASE_REF" \
              | sort -u; } > base-names.txt || true

          git show "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)":MSFSBlindAssist/MainForm.AircraftSwitch.cs > switch-before.txt
          git show HEAD:MSFSBlindAssist/MainForm.AircraftSwitch.cs > switch-after.txt

          # The checkout is the PR's merge commit, whose second parent is the PR head, so
          # the head and its history are normally present, a fork's PR too. If not, fetch
          # it: an empty list would flag every hash.
          if ! git cat-file -e "$PR_HEAD^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/self"
          fi
          # A commit only on the base is not in this list, so a build of main alone is
          # flagged like a combined one.
          git rev-list "origin/$GITHUB_BASE_REF..$PR_HEAD" > pr-commits.txt

          # stacked.txt: the open PRs this one stacks on. Always written, empty when the base is not main or nothing is found: the check
          # requires the file. Only an older open PR into main is compared, so only the
          # newer PR of a stacked pair is flagged (a follow-up is opened after its parent),
          # and the parent stays unflagged even after review fixes move its head on. A child
          # PR planned into this PR's branch has another base, so it is never compared.
          : > stacked.txt
          if [ "$GITHUB_BASE_REF" = "main" ]; then
            gh pr list --state open --base main --json number,baseRefName --limit 200 \
              --jq '.[] | select(.baseRefName == "main") | .number' > open-prs.txt || : > open-prs.txt
            while read -r n; do
              [ -n "$n" ] || continue
              [ "$n" -lt "$PR_NUMBER" ] || continue
              git fetch --no-tags origin "+refs/pull/$n/head:refs/remotes/pr/$n" 2>/dev/null || continue
              for base in $(git merge-base --all "$PR_HEAD" "refs/remotes/pr/$n"); do
                if ! git merge-base --is-ancestor "$base" origin/main; then
                  echo "$n" >> stacked.txt
                  break
                fi
              done
            done < open-prs.txt
          fi

      - name: Check the PR scope
        shell: bash
        env:
          # Through the environment, never ${{ }} inside the script: the description
          # is text anyone opening a PR controls.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > body.md
          # Build first so `dotnet run --no-build` prints only the check's own message.
          dotnet build tools/GuideBuilder -c Release --nologo -v quiet
          status=0
          dotnet run --project tools/GuideBuilder -c Release --no-build -- check-scope \
            --body body.md --base "$GITHUB_BASE_REF" \
            --added added.txt --diff diff.txt --tree tree.txt --test-classes test-classes.txt \
            --switch-before switch-before.txt --switch-after switch-after.txt \
            --stacked stacked.txt --pr-commits pr-commits.txt --base-names base-names.txt \
            > result.txt || status=$?
          cat result.txt
          # A code block: as Markdown, the message's <angle brackets> would vanish as tags.
          {
            echo "### PR scope"
            echo
            echo '```text'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # %0A folds the whole message into ONE annotation, readable on the PR's
            # checks page without opening the log.
            message="$(cat result.txt)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/}"
            message="${message//$'\n'/'%0A'}"
            echo "::error::$message"
          fi
          exit "$status"
