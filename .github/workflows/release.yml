name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The git tag is the single source of truth for the shipped version.
      # v8.0.0 -> 8.0.0, which -p:Version below hands to every project in the
      # solution; the SDK derives AssemblyVersion, FileVersion and
      # InformationalVersion from it. A prerelease tag works too: v8.0.0-rc1
      # gives InformationalVersion 8.0.0-rc1 with Assembly/FileVersion 8.0.0.0.
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      # Do NOT drop -p:Version. Without it the build falls back to the csproj's
      # local-only <Version>0.0.0</Version> and every release ships as 0.0.0 —
      # the app's update check compares its own AssemblyVersion against the
      # latest GitHub tag, so a 0.0.0 release would offer itself as an update.
      - name: Build
        run: dotnet build MSFSBlindAssist.sln -c Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Download Navdatareader
        run: |
          gh release download v1.2.3 -R albar965/navdatareader -p "Navdatareader-win-1.2.3.zip"
          Expand-Archive -Path Navdatareader-win-1.2.3.zip -DestinationPath temp-navdata
          Move-Item temp-navdata\Navdatareader-win-1.2.3 MSFSBlindAssist\bin\x64\Release\net10.0-windows\navdatareader
          Copy-Item MSFSBlindAssist\SimConnect.cfg MSFSBlindAssist\bin\x64\Release\net10.0-windows\navdatareader\
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release zip
        run: |
          Compress-Archive -Path MSFSBlindAssist\bin\x64\Release\net10.0-windows\* -DestinationPath MSFSBA.zip
        shell: pwsh

      # v3 is the Node 24 runtime line; v2 targets the deprecated Node 20 and was
      # only still working because the runner force-ran it on 24. v3.0.0 changed
      # nothing but the runtime -- the inputs below are unchanged from v2.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: MSFSBA.zip
          generate_release_notes: true
